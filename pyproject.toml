[project]
name = "kivora-pipeline"
version = "0.1.0"
description = "Pipeline diario de ventas de Kivora"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
